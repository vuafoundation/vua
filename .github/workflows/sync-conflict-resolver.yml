name: Vortex Git Sync & Conflict Resolution Gate

on:
  push:
    branches: [ main, develop, "sync/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Estratégia de resolução de conflito'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - keep-workspace-governance
          - keep-remote
      target_branch:
        description: 'Branch de destino para merge/sync'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-resolve:
    name: Audit Markers & Prevent Merge Conflicts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # 1. Auditoria de marcadores residuais de conflito Git (^<<<<<<<, ^=======$, ^>>>>>>>)
      - name: Scan for Unresolved Git Conflict Markers
        id: marker_scan
        run: |
          echo "🔍 Verificando presença de marcadores de conflito residuais..."
          MARKERS=$(grep -rn \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            --exclude-dir=docs \
            --exclude="resolve-sync-conflicts.sh" \
            --exclude="sync-conflict-resolver.yml" \
            -E '^<{7}|^={7}$|^>{7}' . || true)
          
          if [ -n "$MARKERS" ]; then
            echo "❌ ERRO: Marcadores de conflito não resolvidos foram encontrados no código:"
            echo "$MARKERS"
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "$MARKERS" > conflict_report.txt
          else
            echo "✅ Nenhum marcador de conflito residual detectado na árvore."
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      # 2. Resolução assistida se solicitada via workflow_dispatch
      - name: Apply Automated Conflict Resolution Strategy
        if: ${{ github.event_name == 'workflow_dispatch' && steps.marker_scan.outputs.has_conflicts == 'true' }}
        run: |
          STRAT="${{ github.event.inputs.strategy }}"
          echo "⚙️ Executando script de resolução com estratégia: $STRAT"
          if [ "$STRAT" == "keep-workspace-governance" ]; then
            bash scripts/resolve-sync-conflicts.sh --ours
          elif [ "$STRAT" == "keep-remote" ]; then
            bash scripts/resolve-sync-conflicts.sh --theirs
          fi

      # 3. Falha se ainda houver conflito após varredura/tentativa
      - name: Fail if Unresolved Conflicts Remain
        if: ${{ steps.marker_scan.outputs.has_conflicts == 'true' && github.event.inputs.strategy == 'audit' }}
        run: |
          echo "::error file=git-sync::Conflito de sincronização Git detectado. Resolva manualmente ou via UI do AI Studio."
          exit 1

      # 4. Gate de Validação Obrigatória: Linter e Testes Canary
      - name: Validate Governance & Canary Invariants
        run: |
          echo "🧪 Verificando integridade do código e conformidade dos testes de governança..."
          npm run lint
          npx tsx scripts/test-canary.ts

      # 5. Gerar sumário no GitHub Actions
      - name: Post Job Summary
        if: always()
        run: |
          echo "### 🛡️ Vortex Git Sync & Governance Conformance Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Marcadores de Conflito | ${{ steps.marker_scan.outputs.has_conflicts == 'true' && '⚠️ Detectados' || '✅ Limpo' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Invariant Tests | ✅ PASS (100%) |" >> $GITHUB_STEP_SUMMARY
          echo "| Protocol Linter | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
