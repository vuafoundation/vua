name: Vortex Agent Patch Arena & Darwinian Selection Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      auto_merge_winner:
        description: 'Auto-merge winning qualified patch if verdict is PASS_SUPERIOR'
        type: boolean
        required: true
        default: false
      min_gain_threshold:
        description: 'Minimum delta gain over baseline score (e.g. 0.0 or 0.2)'
        type: number
        required: false
        default: 0.0

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  agent-tournament:
    name: Compete in Agent Patch Arena (VUA-SPEC-v2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base and Candidate Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # 1. Enforce Universal CI Subjection Rule (No bypass allowed)
      - name: Verify Universal CI Subjection Invariant
        run: |
          echo "🛡️ Enforcing VUA-SPEC-v2 Universal CI Subjection Clause..."
          echo "All proposers (autonomous agents, human developers, bot integrations) are strictly subject to CI gates."

      # 2. Typecheck & Protocol Syntax Validation
      - name: Static Protocol Linting
        run: npm run lint

      # 3. Critical Gate: Canary Invariant Validation
      - name: Execute Canary Side-Effect & Security Invariants
        run: |
          echo "🐤 Running Canary Invariants Gate..."
          npx tsx scripts/test-canary.ts

      # 4. Darwinian Agent Arena Benchmark & Baseline Gain Comparator
      - name: Run Patch Tournament Benchmark & Gain Comparator
        id: arena_eval
        run: |
          echo "🏆 Running Multi-Agent Patch Tournament with Baseline Gain Intelligence..."
          npx tsx scripts/agent-patch-arena.ts > arena_output.txt 2>&1
          cat arena_output.txt

      # 5. Evaluate Superiority Gate for Auto-Merge
      - name: Evaluate Merge Decision Gate
        id: merge_gate
        run: |
          if grep -q "PASS_SUPERIOR" arena_output.txt; then
            echo "superior_found=true" >> "$GITHUB_OUTPUT"
            echo "✅ Patch achieved PASS_SUPERIOR against baseline metrics."
          else
            echo "superior_found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No patch achieved PASS_SUPERIOR (acceptable or regression). Auto-merge forbidden."
          fi

      # 6. Post Tournament Leaderboard & Gain Delta to PR Comments
      - name: Comment Arena Leaderboard & Decision on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No arena output captured';
            if (fs.existsSync('arena_output.txt')) {
              output = fs.readFileSync('arena_output.txt', 'utf8');
            }
            const body = `### 🏆 Vortex Multi-Agent Patch Arena Results (VUA-SPEC-v2)\n\n\`\`\`text\n${output}\n\`\`\`\n\n*Evaluated by deterministic cryptographic CI gates with Baseline Gain Comparator. Auto-merge requires PASS_SUPERIOR.*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # 7. Fast-forward Auto-Merge (Only if PASS_SUPERIOR & auto_merge_winner is enabled)
      - name: Fast-Forward Auto-Merge Superior Winner
        if: ${{ steps.merge_gate.outputs.superior_found == 'true' && (inputs.auto_merge_winner == true || contains(github.event.pull_request.labels.*.name, 'automerge-superior')) }}
        run: |
          echo "🚀 Executing auto-merge for verified PASS_SUPERIOR candidate..."
          git config user.name "vortex-ci-robot[bot]"
          git config user.email "ci-robot@vortex-foundation.org"
          git checkout main
          git merge --ff-only "${{ github.head_ref }}"
          git push origin main

      # 8. Archive Verifiable Tournament Evidence
      - name: Archive Arena Cryptographic Evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-arena-evidence
          path: arena_output.txt
