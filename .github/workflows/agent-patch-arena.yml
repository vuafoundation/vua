name: Agent Patch Arena — Benchmark Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: agent-patch-arena-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arena:
    name: Trusted benchmark comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: evaluator

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evaluator/package-lock.json

      - name: Verify candidate is reachable
        working-directory: evaluator
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git cat-file -e "$HEAD_SHA^{commit}"

      - name: Run trusted Patch Arena policy tests
        working-directory: evaluator
        run: python3 scripts/test-agent-patch-arena-policy.py

      - name: Run trusted Patch Arena
        working-directory: evaluator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/agent-patch-arena.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_WORKSPACE/arena-result.json"

      - name: Publish benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch-arena-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: arena-result.json
          retention-days: 30

      - name: Enforce Arena verdict
        run: |
          python3 - <<'PY'
          import json
          with open('arena-result.json', encoding='utf-8') as f:
              result = json.load(f)
          allowed = {'PASS_SUPERIOR', 'PASS_NO_REGRESSION'}
          print('Arena change class:', result.get('change_class'))
          print('Arena verdict:', result.get('verdict'))
          print('Reason:', result.get('reason'))
          if result.get('verdict') not in allowed:
              raise SystemExit(1)
          PY
