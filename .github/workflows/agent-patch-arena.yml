name: Agent Patch Arena — Benchmark Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: agent-patch-arena-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arena:
    name: Trusted benchmark comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: evaluator

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evaluator/package-lock.json

      - name: Verify candidate is reachable
        working-directory: evaluator
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git cat-file -e "$HEAD_SHA^{commit}"

      - name: Classify benchmark applicability
        id: applicability
        working-directory: evaluator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|server\.ts$|bin/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "requires_benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "requires_benchmark=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record non-applicable benchmark evidence
        if: steps.applicability.outputs.requires_benchmark == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/arena-result.json" <<JSON
          {
            "schema": "vortex.patch-arena.v1",
            "base_sha": "$BASE_SHA",
            "head_sha": "$HEAD_SHA",
            "verdict": "PASS_NOT_APPLICABLE",
            "reason": "No runtime, executable, dependency, or benchmark input changed.",
            "quality": {"passed": true},
            "benchmark": {"applicable": false}
          }
          JSON

      - name: Run trusted Patch Arena
        if: steps.applicability.outputs.requires_benchmark == 'true'
        working-directory: evaluator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/agent-patch-arena.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_WORKSPACE/arena-result.json"

      - name: Publish benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch-arena-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: arena-result.json
          retention-days: 30

      - name: Enforce Arena verdict
        run: |
          python3 - <<'PY'
          import json
          with open('arena-result.json', encoding='utf-8') as f:
              result = json.load(f)
          print('Arena verdict:', result.get('verdict'))
          print('Reason:', result.get('reason'))
          if result.get('verdict') not in ('PASS_SUPERIOR', 'PASS_NOT_APPLICABLE'):
              raise SystemExit(1)
          PY
