name: apply-p0-production-fix

on:
  push:
    branches:
      - fix/p0-mcp-verify-claude-oauth

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-mcp-verify-claude-oauth
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-p0-production-fix.py
      - name: Validate and publish diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -f /tmp/p0-validation.log
          echo '=== npm ci ===' >> /tmp/p0-validation.log
          npm ci >> /tmp/p0-validation.log 2>&1
          echo "EXIT=$?" >> /tmp/p0-validation.log
          echo '=== npm run lint ===' >> /tmp/p0-validation.log
          npm run lint >> /tmp/p0-validation.log 2>&1
          echo "EXIT=$?" >> /tmp/p0-validation.log
          echo '=== npm run build ===' >> /tmp/p0-validation.log
          npm run build >> /tmp/p0-validation.log 2>&1
          echo "EXIT=$?" >> /tmp/p0-validation.log
          echo '=== mcp verify tamper ===' >> /tmp/p0-validation.log
          npx tsx scripts/test-mcp-verify-tamper.ts >> /tmp/p0-validation.log 2>&1
          echo "EXIT=$?" >> /tmp/p0-validation.log
          echo '=== node syntax ===' >> /tmp/p0-validation.log
          node --check dist/server.cjs >> /tmp/p0-validation.log 2>&1
          echo "EXIT=$?" >> /tmp/p0-validation.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          log=Path('/tmp/p0-validation.log').read_text()[-60000:]
          body='Automated P0 production-fix diagnostics for branch `fix/p0-mcp-verify-claude-oauth`.\n\n```text\n'+log+'\n```'
          import urllib.request
          data=json.dumps({'title':'P0 validation diagnostics','body':body,'labels':['ci']}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues',data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req) as r: print(r.read().decode())
          except Exception as e: print('diagnostic issue creation failed:',e)
          PY
      - name: Stop after diagnostics
        run: exit 0
