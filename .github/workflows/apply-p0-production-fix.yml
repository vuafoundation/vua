name: apply-p0-production-fix

on:
  push:
    branches:
      - fix/p0-mcp-verify-claude-oauth

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-mcp-verify-claude-oauth
          fetch-depth: 0
      - name: Apply production patch
        run: |
          python3 scripts/apply-p0-production-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/vortex/mcp-server.ts')
          s=p.read_text()
          s=s.replace("const proof = args.input?.execution_proof as any;","const input = (args.input as Record<string, unknown> | undefined) || {};\n      const proof = input.execution_proof as any;")
          s=s.replace("typeof args.input?.expected_hash === 'string' ? args.input.expected_hash : undefined","typeof input.expected_hash === 'string' ? input.expected_hash : undefined")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -e
          npm ci
          npm run lint
          npm run build
          npx tsx scripts/test-mcp-verify-tamper.ts
          node --check dist/server.cjs
      - name: Publish production PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="fix/p0-mcp-verify-claude-oauth-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          rm -f .github/workflows/apply-p0-production-fix.yml scripts/apply-p0-production-fix.py docs/p0-validation.log docs/.p0-oauth-trigger
          git config user.name 'vua-ci'
          git config user.email 'vua-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): harden MCP proof verification and Claude OAuth'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'fix(security): harden MCP proof verification and Claude OAuth' --body-file /dev/stdin <<'EOF'
          ## P0 production fix

          - routes `vortex.verify` through the independent verifier;
          - binds `proof_hash` to the canonical unsigned ExecutionProof;
          - rejects tampered input/output hashes and invalid signatures fail-closed;
          - adds MCP Protected Resource Metadata and OAuth Authorization Server discovery;
          - adds OAuth Authorization Code + PKCE S256, dynamic registration, resource binding and Bearer validation;
          - supports `VUA_OAUTH_REQUIRED=false` for anonymous/local mode and `true` for Claude OAuth mode;
          - adds a regression test proving original proofs verify and tampered proofs are rejected.

          Claude configuration: remote MCP URL `/mcp`; login off for anonymous mode, login on for OAuth mode. OAuth client ID/secret remain optional for public PKCE clients.
          EOF
