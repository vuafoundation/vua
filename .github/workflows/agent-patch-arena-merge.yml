name: Agent Patch Arena — Promotion Eligibility

on:
  workflow_run:
    workflows: ["Agent Patch Arena — Benchmark Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: agent-patch-arena-promotion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  promote:
    name: Validate promotion eligibility
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: protected-promotion

    steps:
      - name: Download exact Arena evidence
        uses: actions/download-artifact@v4
        with:
          name: agent-patch-arena-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/arena
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable Arena evidence
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arena' / 'arena-result.json'
          result = json.loads(p.read_text(encoding='utf-8'))
          required = [
              'schema', 'trusted_base', 'base_sha', 'head_sha',
              'change_class', 'verdict', 'quality',
              'evaluator_sha256', 'policy_sha256'
          ]
          missing = [k for k in required if k not in result]
          if missing:
              raise SystemExit(f'Missing evidence fields: {missing}')
          if result['schema'] != 'vortex.patch-arena.v3':
              raise SystemExit('Unsupported Arena evidence schema')
          if result['trusted_base'] is not True:
              raise SystemExit('Trusted-base invariant failed')
          if result['head_sha'] != os.environ['RUN_HEAD_SHA']:
              raise SystemExit('Evidence head SHA does not match workflow head SHA')
          if result['quality'].get('passed') is not True:
              raise SystemExit('Absolute quality gates did not pass')
          if result['change_class'] == 'mixed':
              raise SystemExit('Mixed change is not eligible for promotion')
          allowed = {
              'performance': 'PASS_SUPERIOR',
              'security': 'PASS_NO_REGRESSION',
              'correctness': 'PASS_NO_REGRESSION',
              'governance': 'PASS_GOVERNANCE',
          }
          if result['verdict'] != allowed.get(result['change_class']):
              raise SystemExit('Arena verdict does not match change class')
          print(json.dumps(result, indent=2))
          PY

      - name: Require all protected PR checks to pass
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --repo "$REPO" --required --watch --fail-fast

      - name: Require PR to remain open and non-draft
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json state,isDraft,baseRefName,baseRefOid,headRefOid

      - name: Mark PR ready for author action
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "Vortex promotion gate: ALL REQUIRED CI CHECKS PASSED. Arena evidence is valid and bound to the exact base/head SHAs. The PR is eligible for author/maintainer action. CI does not close or merge the PR automatically; the author remains responsible for resolving failures and, after all requirements are satisfied, closing/merging the PR through the protected repository policy."
