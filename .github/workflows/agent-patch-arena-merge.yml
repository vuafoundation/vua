name: Agent Patch Arena — Promotion

on:
  workflow_run:
    workflows: ["Agent Patch Arena — Benchmark Gate"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: agent-patch-arena-promotion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote approved benchmark-superior patch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: protected-promotion

    steps:
      - name: Download exact Arena evidence
        uses: actions/download-artifact@v4
        with:
          name: agent-patch-arena-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/arena
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate evidence and current PR identity
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, pathlib

          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arena' / 'arena-result.json'
          result = json.loads(p.read_text(encoding='utf-8'))

          required = [
              'schema', 'trusted_base', 'base_sha', 'head_sha',
              'change_class', 'verdict', 'quality',
              'evaluator_sha256', 'policy_sha256'
          ]
          missing = [k for k in required if k not in result]
          if missing:
              raise SystemExit(f'Missing evidence fields: {missing}')

          if result['schema'] != 'vortex.patch-arena.v3':
              raise SystemExit('Unsupported Arena evidence schema')
          if result['trusted_base'] is not True:
              raise SystemExit('Trusted-base invariant failed')
          if result['head_sha'] != os.environ['RUN_HEAD_SHA']:
              raise SystemExit('Evidence head SHA does not match workflow head SHA')
          if result['change_class'] != 'performance':
              raise SystemExit('Only pure performance changes may use automatic Arena promotion')
          if result['verdict'] != 'PASS_SUPERIOR':
              raise SystemExit('Arena verdict is not PASS_SUPERIOR')
          if result['quality'].get('passed') is not True:
              raise SystemExit('Absolute quality gates did not pass')
          PY

          PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,state,isDraft,baseRefName,baseRefOid,headRefOid,mergeStateStatus,labels)"
          export PR_JSON

          python3 - <<'PY'
          import json, os, pathlib

          pr = json.loads(os.environ['PR_JSON'])
          result = json.loads(
              (pathlib.Path(os.environ['RUNNER_TEMP']) / 'arena' / 'arena-result.json')
              .read_text(encoding='utf-8')
          )

          if pr['state'] != 'OPEN':
              raise SystemExit('PR is not open')
          if pr['isDraft']:
              raise SystemExit('PR is still draft')
          if pr['baseRefName'] != 'main':
              raise SystemExit('PR base is not main')
          if pr['headRefOid'] != result['head_sha']:
              raise SystemExit('PR head changed after benchmark; refusing promotion')
          if pr['baseRefOid'] != result['base_sha']:
              raise SystemExit('main advanced after benchmark; fresh Arena run required')
          if pr['mergeStateStatus'] == 'DIRTY':
              raise SystemExit('PR has merge conflicts; refusing promotion')

          labels = {item['name'] for item in pr['labels']}
          if 'automerge-superior' not in labels:
              raise SystemExit('Explicit maintainer label automerge-superior is required')
          PY

      - name: Enable protected auto-merge
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash \
            --match-head-commit "$HEAD_SHA"

      - name: Record promotion decision
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "Vortex Agent Patch Arena v3: PASS_SUPERIOR. Exact base/head SHAs matched, pure performance intent was verified by the trusted-base evaluator, and maintainer label automerge-superior plus protected promotion environment were present. Protected auto-merge enabled; GitHub required checks/reviews remain authoritative."
